---
- name: Instalar K3s Server
  hosts: k3s_server
  become: true

  pre_tasks:
    - name: Esperar conexión SSH
      wait_for_connection:
        timeout: 180

  tasks:
    - name: Instalar K3s Server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Esperar K3s
      command: k3s kubectl get nodes
      register: result
      retries: 20
      delay: 5
      until: result.rc == 0
      changed_when: false

    - name: Obtener token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token

    - name: Guardar token
      set_fact:
        k3s_token: "{{ token.content | b64decode | trim }}"


- name: Instalar K3s Workers
  hosts: k3s_workers
  become: true

  pre_tasks:
    - name: Esperar conexión SSH
      wait_for_connection:
        timeout: 180

  tasks:
    - name: Instalar K3s Agent
      shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ hostvars[groups['k3s_server'][0]].private_ip }}:6443 \
        K3S_TOKEN="{{ hostvars[groups['k3s_server'][0]].k3s_token }}" \
        sh -
      args:
        creates: /usr/local/bin/k3s-agent


- name: Validar cluster
  hosts: k3s_server
  become: true

  tasks:
    - name: Esperar Worker
      command: k3s kubectl get nodes
      register: nodes
      retries: 20
      delay: 5
      until: "'k3s-worker' in nodes.stdout"
      changed_when: false

    - name: Mostrar nodos
      command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Resultado
      debug:
        var: nodes.stdout_lines
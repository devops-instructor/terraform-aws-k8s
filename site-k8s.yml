---
- name: Instalar K3s Server
  hosts: k3s_server
  become: true

  pre_tasks:
    - name: Esperar conexión SSH
      wait_for_connection:
        delay: 20
        timeout: 180

  tasks:
    - name: Instalar K3s Server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Esperar K3s
      command: k3s kubectl get nodes
      register: result
      retries: 20
      delay: 5
      until: result.rc == 0
      changed_when: false

    - name: Obtener token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token

    - name: Guardar token
      set_fact:
        k3s_token: "{{ token.content | b64decode | trim }}"


- name: Instalar K3s Workers
  hosts: k3s_workers
  become: true

  pre_tasks:
    - name: Esperar conexión SSH
      wait_for_connection:
        delay: 20
        timeout: 180

  tasks:
    - name: Instalar K3s Agent
      shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ hostvars[groups['k3s_server'][0]].private_ip }}:6443 \
        K3S_TOKEN="{{ hostvars[groups['k3s_server'][0]].k3s_token }}" \
        sh -
      args:
        # creates: /usr/local/bin/k3s-agent
        creates: /etc/systemd/system/k3s-agent.service


- name: Validar cluster
  hosts: k3s_server
  become: true

  tasks:
    - name: Esperar Workers
      shell: k3s kubectl get nodes --no-headers | grep -c " Ready "
      register: ready_nodes
      retries: 20
      delay: 5
      until: ready_nodes.stdout | int >= (groups['k3s_workers'] | length + 1)
      changed_when: false

    - name: Mostrar nodos
      command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Resultado
      debug:
        var: nodes.stdout_lines

- name: Instalar Headlamp
  hosts: k3s_server
  become: true

  tasks:
    - name: Instalar Headlamp
      command:
        cmd: k3s kubectl apply -f -
        stdin: "{{ lookup('file', 'k3s-headlamp.yaml') }}"
      register: headlamp_install
      changed_when: >
        'created' in headlamp_install.stdout or
        'configured' in headlamp_install.stdout

    - name: Esperar creación de Headlamp
      command: k3s kubectl get deployment headlamp -n headlamp
      register: headlamp_deployment
      retries: 30
      delay: 5
      until: headlamp_deployment.rc == 0
      changed_when: false

    - name: Esperar Headlamp
      command: >
        k3s kubectl wait
        --namespace=headlamp
        --for=condition=Available
        deployment/headlamp
        --timeout=180s
      changed_when: false

    - name: Mostrar Headlamp
      command: k3s kubectl get pods,svc -n headlamp
      register: headlamp
      changed_when: false

    - name: Resultado Headlamp
      debug:
        var: headlamp.stdout_lines